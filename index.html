<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a1a6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>သီတင်းကျွတ် ချစ်သူ့ကံစမ်း</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd166;--orange:#ff8a3d;--text:#fff7e6;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
html{overflow-x:hidden}body{overflow-x:clip}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:'Noto Sans Myanmar','Padauk','Myanmar Text',sans-serif;color:var(--text);background:radial-gradient(ellipse at 50% 0%,#7a2a7a 0%,#4a1a6b 38%,#1a0b3d 100%) fixed;line-height:1.7;min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button,.gift{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fl{position:absolute;bottom:-60px;animation:rise linear infinite;filter:drop-shadow(0 0 10px #ffb347)}
@keyframes rise{to{transform:translateY(-115vh) translateX(var(--dx,20px)) rotate(var(--r,8deg))}}
.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:tw 3s infinite}
@keyframes tw{50%{opacity:.2}}
main{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:max(12px,var(--sat)) max(16px,var(--sar)) calc(24px + var(--sab)) max(16px,var(--sal));text-align:center}
h1{margin:2px 0 0;font-size:clamp(1.25rem,6vw,1.6rem);font-weight:800;color:var(--gold);text-shadow:0 0 18px rgba(255,120,160,.8)}
.sub{opacity:.85;font-size:.85rem;margin-bottom:8px}
.lamps{font-size:1.5rem;letter-spacing:6px}
.name{width:100%;max-width:300px;min-height:44px;padding:8px 16px;border-radius:99px;border:1.5px solid rgba(255,209,102,.5);background:rgba(255,255,255,.1);color:var(--text);font-family:inherit;text-align:center;font-size:16px;outline:0}
.name:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,209,102,.25)}
.name::placeholder{color:#ffd9e6aa}
.info{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0 16px;font-weight:600;font-size:.88rem}
.pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,209,102,.4);padding:3px 14px;border-radius:99px}
.pill b{color:var(--gold)}
/* gift box */
.scene{position:relative;width:100%;max-width:380px;height:300px;margin:0 auto;display:grid;place-items:end center;--gl:255,200,80}
.scene[data-r="0"]{--gl:255,120,170}.scene[data-r="2"]{--gl:200,120,255}
.pedestal{position:absolute;bottom:4px;width:88%;height:64px;border-radius:50%;background:radial-gradient(closest-side,#8a3a9a,#4a1a6b 70%,transparent 72%);box-shadow:0 0 40px rgba(255,100,160,.45),inset 0 -6px 0 rgba(0,0,0,.35)}
.gglow{position:absolute;bottom:60px;left:50%;width:260px;height:260px;margin-left:-130px;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,rgba(255,240,200,.95),rgba(var(--gl),.55) 45%,transparent 70%);opacity:0;transform:scale(.3)}
.rays{position:absolute;bottom:20px;left:50%;width:520px;height:520px;margin-left:-260px;margin-bottom:-130px;pointer-events:none;opacity:0;background:repeating-conic-gradient(rgba(var(--gl),.28) 0 8deg,transparent 8deg 20deg);-webkit-mask:radial-gradient(closest-side,#000 30%,transparent 70%);mask:radial-gradient(closest-side,#000 30%,transparent 70%)}
.gift{position:relative;width:180px;height:200px;margin-bottom:30px;animation:float 3s ease-in-out infinite;cursor:pointer}
.box{position:absolute;bottom:0;left:10px;width:160px;height:125px;border-radius:10px;background:linear-gradient(90deg,#c2306b,#ff7aa8 45%,#ffa5c6 60%,#c2306b);box-shadow:inset 0 -10px 0 rgba(0,0,0,.12)}
.box::before,.lid::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:28px;margin-left:-14px;background:linear-gradient(90deg,#e07b00,var(--gold) 50%,#e07b00)}
.box::after{content:"💖";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.6rem;filter:drop-shadow(0 0 6px #fff)}
.lid{position:absolute;bottom:113px;left:0;width:180px;height:40px;border-radius:8px;background:linear-gradient(90deg,#c2306b,#ff9cc0 50%,#c2306b);box-shadow:0 6px 10px rgba(0,0,0,.25);transform-origin:20% 100%}
.bow{position:absolute;bottom:34px;left:50%;width:120px;height:56px;margin-left:-60px}
.bow i{position:absolute;bottom:0;width:58px;height:46px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:12px solid var(--gold);border-bottom-color:#e07b00}
.bow i:first-child{left:2px;transform:rotate(-24deg)}.bow i:last-child{right:2px;transform:rotate(24deg)}
.bow b{position:absolute;bottom:4px;left:50%;width:26px;height:26px;margin-left:-13px;transform:rotate(45deg);background:linear-gradient(135deg,#ffd1f0,#c13a9a);border:3px solid var(--gold);border-radius:4px;box-shadow:0 0 14px #ff8ad8}
.scene.shaking .gift{animation:shake .45s cubic-bezier(.36,.07,.19,.97) infinite}
.scene.shaking .gglow{animation:charge 1.6s ease-in forwards}
.scene.opened .gift{animation:none}
.scene.opened .lid{animation:lidOff .7s cubic-bezier(.2,.8,.3,1) forwards}
.scene.opened .gglow{opacity:.6;transform:scale(.8);animation:boom .8s ease-out forwards}
.scene.opened .rays{animation:spinRays 6s linear infinite,fadeIn .5s ease-out forwards}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg) translateY(-4px)}40%{transform:rotate(6deg) translateY(-6px)}60%{transform:rotate(-5deg) translateY(-4px)}80%{transform:rotate(5deg) translateY(-2px)}}
@keyframes charge{to{opacity:.6;transform:scale(.8)}}
@keyframes lidOff{to{transform:translate(-70px,-170px) rotate(-38deg);opacity:0}}
@keyframes boom{to{opacity:1;transform:scale(1.3)}}
@keyframes spinRays{to{transform:rotate(360deg)}}
@keyframes fadeIn{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.gift,.scene.shaking .gift,.scene.opened .rays{animation:none}}
button{font-family:inherit;cursor:pointer;border:0;border-radius:99px;font-weight:800}
.spin{margin-top:20px;width:100%;max-width:340px;min-height:54px;padding:12px;font-size:1.15rem;color:#3a1255;background:linear-gradient(135deg,#ffe29a,#ff9a3d);box-shadow:0 6px 22px rgba(255,150,40,.55)}
.spin:disabled{opacity:.5;filter:grayscale(.5)}
.spin:active{transform:scale(.97)}
.ghost{min-height:44px;padding:8px 14px;font-size:.88rem;color:var(--text);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3)}
.hist{margin-top:18px;background:rgba(255,255,255,.08);border-radius:18px;padding:12px;text-align:left}
.hist h3{margin:0 0 6px;font-size:.95rem;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:12px;padding:2px 10px;font-size:.82rem;border:1px solid}
.c0{background:rgba(255,120,170,.18);border-color:#ff7aa8}.c1{background:rgba(255,209,102,.2);border-color:#ffd166}.c2{background:rgba(160,100,255,.3);border-color:#c9a0ff}
.modal{position:fixed;inset:0;z-index:10;background:rgba(10,0,30,.82);display:none;align-items:center;justify-content:center;padding:max(16px,var(--sat)) max(16px,var(--sar)) max(16px,var(--sab)) max(16px,var(--sal));overscroll-behavior:contain}
.modal.on{display:flex}
.card{width:100%;max-width:400px;max-height:90vh;max-height:calc(100dvh - 32px - var(--sat) - var(--sab));overflow:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(160deg,#5a1a6b,#2a0d4d);border:2px solid var(--gold);border-radius:24px;padding:22px 18px;text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.card.r2{border-color:#c9a0ff;box-shadow:0 0 50px #a050ff;animation:pop .45s cubic-bezier(.2,1.6,.4,1),glow2 .6s infinite alternate}
.card.r1{box-shadow:0 0 30px rgba(255,209,102,.7)}
@keyframes glow2{to{box-shadow:0 0 90px 10px #ff6fd8}}
@keyframes pop{from{transform:scale(.4) rotate(-6deg);opacity:0}}
.big{font-size:clamp(3rem,16vw,3.8rem);animation:beat2 1s infinite}
@keyframes beat2{50%{transform:scale(1.15)}}
.tag{display:inline-block;padding:1px 14px;border-radius:99px;font-size:.8rem;font-weight:800;margin-bottom:4px;background:#ff7aa8;color:#3a1255}
.r1 .tag{background:var(--gold)}.r2 .tag{background:linear-gradient(90deg,#c9a0ff,#ff6fd8);color:#2a0d4d}
.card h2{margin:4px 0;color:var(--gold)}
.money{margin-top:10px;font-size:1.25rem;font-weight:800;color:var(--gold);background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.5);border-radius:14px;padding:6px;text-shadow:0 0 12px #ffb300;opacity:0;animation:moneyIn .9s .9s both}
@keyframes moneyIn{0%{opacity:0;transform:scale(.2) rotate(-8deg)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
.row{display:flex;justify-content:space-between;gap:8px;background:rgba(255,255,255,.1);border-radius:12px;padding:6px 12px;margin:6px 0;text-align:left;font-size:.9rem}
.row span:last-child{color:var(--gold);font-weight:800;white-space:nowrap}
.total{margin-top:10px;font-size:1.25rem;font-weight:800;color:var(--gold)}
.love{margin-top:10px;font-size:1rem;color:#ffc2d9;white-space:pre-line;line-height:1.9}
.empty{opacity:.6;font-size:.85rem}
.flash{position:fixed;inset:0;z-index:9;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:fl .7s}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
.p{position:fixed;z-index:20;pointer-events:none;animation:burst var(--t,2.4s) ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--rr)) scale(1);opacity:0}}
/* sticky main action — within thumb reach */
.cta{position:sticky;bottom:calc(10px + var(--sab));z-index:3;margin-top:8px}
.cta .spin{margin-top:12px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tools .ghost{padding:8px 6px;font-size:.8rem;line-height:1.3}
.card .ghost{margin-top:10px}
/* short phones / landscape */
@media (max-height:700px){.scene{height:250px}.gift{zoom:.82}.lamps{font-size:1.2rem}.sub{margin-bottom:4px}}
@media (max-height:560px){.scene{height:200px}.gift{zoom:.64}.lamps,.sub{display:none}}
/* tablets & desktop */
@media (min-width:600px){main{padding-top:32px}.scene{height:340px}.gift{zoom:1.1}.tools .ghost{font-size:.88rem}}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="flash" id="flash"></div>
<main>
  <div class="lamps">🏮💖🏮</div>
  <h1>သီတင်းကျွတ် ချစ်သူ့ကံစမ်း</h1>
  <div class="sub">ဘူးလေးဖွင့်တိုင်း ကိုကို့ရဲ့ အံ့သြစရာလေးတွေ ပါလာမယ် 🎁</div>
  <input class="name" id="nm" placeholder="သူ့နာမည် ရိုက်ထည့်ပါ 💕" maxlength="30" autocomplete="off" enterkeyhint="done" aria-label="နာမည်">
  <div class="info">
    <span class="pill">ကျန်အကြိမ် <b id="left">-</b></span>
    
  </div>

  <div class="scene" id="scene">
    <div class="rays"></div>
    <div class="gglow"></div>
    <div class="pedestal"></div>
    <div class="gift" id="gift" aria-hidden="true">
      <div class="box"></div>
      <div class="lid"><div class="bow"><i></i><i></i><b></b></div></div>
    </div>
  </div>

  <div class="cta"><button class="spin" id="spinBtn">ဖွင့်မယ်! 🎁</button></div>
  <div class="hist">
    <h3>ရလဒ်များ</h3>
    <div class="chips" id="chips"></div>
  </div>
  <div class="tools">
    <button class="ghost" id="sndBtn">🔊 အသံ</button>
    <button class="ghost" id="musBtn">🎵 နောက်ခံတေး</button>
    <button class="ghost" id="clearBtn">🗑️ Data ရှင်းမယ်</button>
  </div>
</main>

<div class="modal" id="win"><div class="card" id="wCard">
  <div class="tag" id="wTag"></div>
  <div class="big" id="wIcon"></div>
  <h2 id="wName"></h2>
  <div class="money" id="wMoney"></div>
  <button class="spin" style="margin-top:14px" onclick="closeWin()">ကောင်းပါပြီ 💕</button>
</div></div>

<div class="modal" id="final"><div class="card r1">
  <div class="big">🏮🎉💖</div>
  <h2>နောက်ဆုံး ရလဒ်</h2>
  <div id="summary"></div>
  <div class="total" id="totalTxt"></div>
  <div class="love" id="loveTxt"></div>
  <button class="spin" style="margin-top:14px" onclick="document.getElementById('final').classList.remove('on')">ပိတ်မယ်</button>
  <br><button class="ghost" onclick="clearData()">အသစ်ပြန်စမယ်</button>
</div></div>

<script>
var KEY='thadingyut_love_v3', MODES=[3,5,7,10], DEF_N=5, TOTAL=50000, DEF_NAME="Ko Ko's Noe Lay ❤️";
var PR=[
 {i:'🤗',s:'ဖက်ကူပွန်',n:'ကြိုက်တဲ့အချိန် သုံးလို့ရတဲ့ ကြာကြာလေး ဖက်ထားပေးမယ့် ကူပွန် 🤗',r:0},
 {i:'💬',s:'ချစ်တယ် ၁၀ ခါ',n:'မျက်လုံးချင်းဆိုင်ပြီး "ချစ်တယ်" လို့ ၁၀ ခါ ပြောပေးမယ် 💕',r:0},
 {i:'😘',s:'အာဘွား ၁၀ ခါ',n:'ပါးလေးကို အာဘွား ၁၀ ခါ ပေးမယ် 😘',r:0},
 {i:'🎬',s:'ရုပ်ရှင်ဒိတ်',n:'ရုပ်ရှင်ဒိတ်! လက်မှတ်၊ ပေါက်ပေါက်၊ ကြိုက်တဲ့ကား အကုန် ကိုကို တာဝန်ယူမယ် 🍿',r:2},
 {i:'🎓',s:'Exam fee ကူပွန်',n:'စာမေးပွဲကြေး (Exam fee) ကို ကိုကို ပေးမယ်။ စိတ်အေးအေးနဲ့ စာကြိုးစားနော် 📚',r:1}
];
var RN=['ရိုးရိုး','ရှားပါး ✨','အလွန်ရှားပါး 👑'];
var CL=[['#e8457a','#c2306b'],['#f0a500','#e07b00'],['#8e44ad','#6a2cc7']];
var scene=document.getElementById('scene');
var st,busy=false,snd=true,AC=null;

function mm(x){return String(x).replace(/\d/g,function(d){return '၀၁၂၃၄၅၆၇၈၉'[d]})}
function fmt(a){return mm(a.toString().replace(/\B(?=(\d{3})+(?!\d))/g,','))}
function sh(a){return a.sort(function(){return Math.random()-.5})}
function split(n,T){var u=T/1000,p=[],i;if(!u){for(i=0;i<n;i++)p.push(0);return p}
  var c={};while(Object.keys(c).length<n-1)c[1+Math.floor(Math.random()*(u-1))]=1;
  var a=[0].concat(Object.keys(c).map(Number).sort(function(x,y){return x-y}),[u]);
  for(i=1;i<a.length;i++)p.push((a[i]-a[i-1])*1000);return p}
function pick(){
  var rem=st.n-st.k,miss=[3,4].filter(function(i){return st.prizes.indexOf(i)<0});
  if(miss.length&&(miss.length>=rem||Math.random()<miss.length/rem))return miss[Math.floor(Math.random()*miss.length)];
  return Math.floor(Math.random()*3);
}
function newGame(n){var T=TOTAL;st={n:n,total:T,parts:split(n,T),k:0,prizes:[],next:-1,name:(st&&st.name)||DEF_NAME};st.next=pick();save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY)||'null');
    if(d&&MODES.indexOf(d.n)>=0&&d.total>=50000&&d.total<=100000&&d.total%1000===0&&d.parts&&d.parts.length===d.n&&d.prizes&&d.prizes.length===d.k&&d.k<=d.n&&d.parts.reduce(function(a,b){return a+b},0)===d.total&&(d.k>=d.n||PR[d.next])){st=d;return}}catch(e){}
  st=null;newGame(DEF_N);
}
function newWheel(){scene.classList.remove('shaking','opened');scene.removeAttribute('data-r')}
function sum(){var t=0;for(var i=0;i<st.k;i++)t+=st.parts[i];return t}

function render(){
  var left=st.n-st.k,b=document.getElementById('spinBtn');
  document.getElementById('left').textContent=mm(left)+' / '+mm(st.n);
  b.disabled=busy||left<=0;
  b.textContent=left<=0?'ပြီးပါပြီ':(busy?'ဖွင့်နေသည်… 💓':(st.k===st.n-1?'နောက်ဆုံးဘူး ဖွင့်မယ်! 👑':'ဖွင့်မယ်! 🎁'));
  var ch=document.getElementById('chips');ch.innerHTML=st.k?'':'<span class="empty">မလှည့်ရသေးပါ</span>';
  for(var i=0;i<st.k;i++){var p=PR[st.prizes[i]],e=document.createElement('span');
    e.className='chip c'+p.r;e.innerHTML=mm(i+1)+'. '+p.i+' '+p.s+' <small style="opacity:.65;font-size:.72em">💰'+fmt(st.parts[i])+'</small>';ch.appendChild(e)}
}

/* sound — မြန်မာဆိုင်းသံ: ပတ္တလား၊ ကြေးစည်၊ မောင်း၊ ဝါးလက်ခုပ်၊ ဗုံ (pentatonic) */
var MS=null,REV=null,BUS=null,bgmOn=true;
var PENTA=[0,2,4,7,9];
function note(d){var o=Math.floor(d/5);return 261.63*Math.pow(2,(PENTA[d-o*5]+12*o)/12)}
function audio(){if(!snd)return null;try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
    MS=AC.createGain();MS.gain.value=.9;var cp=AC.createDynamicsCompressor();MS.connect(cp);cp.connect(AC.destination);
    REV=AC.createConvolver();var len=Math.floor(AC.sampleRate*2.2),b=AC.createBuffer(2,len,AC.sampleRate);
    for(var c=0;c<2;c++){var x=b.getChannelData(c);for(var i=0;i<len;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
    REV.buffer=b;var rg=AC.createGain();rg.gain.value=.22;REV.connect(rg);rg.connect(MS)}
  if(AC.state==='suspended')AC.resume()}catch(e){return null}return AC}
function out(n){n.connect(BUS||MS);n.connect(REV)}
function osc(f,t,d,v,type,att,f2){var a=audio();if(!a)return;var o=a.createOscillator(),g=a.createGain(),T=a.currentTime+t;
  o.type=type||'sine';o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);
  g.gain.setValueAtTime(.0001,T);g.gain.linearRampToValueAtTime(v,T+(att||.005));g.gain.exponentialRampToValueAtTime(.0001,T+d);
  o.connect(g);out(g);o.start(T);o.stop(T+d+.05)}
function noise(t,d,v,ft,ff,q){var a=audio();if(!a)return;var len=Math.ceil(a.sampleRate*d),b=a.createBuffer(1,len,a.sampleRate),x=b.getChannelData(0);
  for(var i=0;i<len;i++)x[i]=Math.random()*2-1;
  var s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain(),T=a.currentTime+t;s.buffer=b;fl.type=ft;fl.frequency.value=ff;fl.Q.value=q||1;
  g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.0001,T+d);s.connect(fl);fl.connect(g);out(g);s.start(T)}
function pattala(f,t,v){v=v||.12;osc(f,t,.4,v,'triangle');osc(f*2,t,.18,v*.25);osc(f*4,t,.07,v*.3)}
function bell(f,t,v){v=v||.06;[[1,1],[2.76,.5],[5.4,.25],[8.93,.12]].forEach(function(p){osc(f*p[0],t,1.6/p[0]+.3,v*p[1],'sine',.002)})}
function gong(t,v){v=v||.25;osc(110,t,2.8,v,'sine',.01,98);osc(165,t,2.2,v*.5,'sine',.01,150);osc(231,t,1.6,v*.3,'sine',.01);osc(296,t,1.2,v*.2);noise(t,.08,v*.4,'lowpass',600)}
function drum(t,v){v=v||.3;osc(160,t,.25,v,'sine',.002,60);noise(t,.04,v*.3,'bandpass',1200,2)}
function clap(t,v){v=v||.25;noise(t,.05,v,'bandpass',2500,4);noise(t+.012,.04,v*.6,'bandpass',3200,4)}
function cymbal(t,v){noise(t,.9,v||.12,'highpass',6000);bell(1760,t,.03)}
function melody(seq,t0,step,v){seq.forEach(function(d,i){if(d!==null)pattala(note(d),t0+i*step,v)})}
function duck(v){bgmLv=v;fadeBgm(BGV*v)}

function sfxShake(){var t=0;for(var i=0;i<14;i++){drum(t,.1+i*.015);pattala(note(i%10),t,.05);if(i%2)clap(t+.06,.08);t+=.18-.01*i}}
function sfxOpen(){cymbal(0,.14);bell(note(5),0,.05);bell(note(7),.07,.05);bell(note(9),.14,.05)}
function fanfare(r){
  if(r===0){melody([0,2,4,5],0,.12,.12);bell(note(7),.5,.05);return}
  if(r===1){gong(0,.2);drum(0,.25);drum(.44,.2);melody([2,4,5,7,6,7,9],.05,.11,.12);bell(note(10),.85,.06);return}
  gong(0,.32);for(var i=0;i<6;i++)drum(i*.11,.15+i*.03);
  melody([5,7,9,10,9,7,9,10,12],.1,.1,.13);
  for(var j=0;j<6;j++)bell(note(15-j),1.05+j*.06,.035);cymbal(1.05,.12)}
function coin(){for(var i=0;i<10;i++)osc(note(10+i%5)*2,1+i*.12,.08,.03,'square');bell(note(12),2.25,.06);bell(note(14),2.33,.06)}
function sfxFinal(){gong(0,.3);for(var i=0;i<8;i++){drum(i*.25,i%4?.12:.22);clap(i*.25+.125,.08)}
  melody([5,7,9,7,10,9,7,9,12,10,12,null,15],.1,.16,.13);cymbal(2.1,.14);gong(2.1,.2)}

/* background music (mp3) */
var BGM=new Audio('bg-music.App.mp3'),BGV=.45,bgmLv=1,bgmFade=null;BGM.loop=true;BGM.preload='auto';BGM.volume=BGV;
function fadeBgm(to){clearInterval(bgmFade);bgmFade=setInterval(function(){var v=BGM.volume,d=to-v;
  if(Math.abs(d)<.02){BGM.volume=to;clearInterval(bgmFade);return}BGM.volume=v+d*.2},40)}
function startBgm(){if(!snd||!bgmOn||!BGM.paused)return;var p=BGM.play();if(p&&p.catch)p.catch(function(){})}
function stopBgm(){BGM.pause()}

/* particles */
function burst(list,n,power){
  for(var i=0;i<n;i++){var e=document.createElement('div');e.className='p';
    e.textContent=list[Math.floor(Math.random()*list.length)];
    e.style.left=(20+Math.random()*60)+'vw';e.style.top=(40+Math.random()*20)+'vh';
    e.style.fontSize=(18+Math.random()*24)+'px';
    var a=Math.random()*6.28,d=(.4+Math.random())*power;
    e.style.setProperty('--x',Math.cos(a)*d+'px');e.style.setProperty('--y',(Math.sin(a)*d-power*.3)+'px');
    e.style.setProperty('--rr',(Math.random()*540-270)+'deg');e.style.setProperty('--t',(1.8+Math.random()*1.4)+'s');
    document.body.appendChild(e);(function(x){setTimeout(function(){x.remove()},3400)})(e)}
}

/* spin */
function spin(){
  if(busy||st.k>=st.n)return;
  busy=true;render();audio();
  newWheel();scene.setAttribute('data-r',PR[st.next].r);void scene.offsetWidth;scene.classList.add('shaking');
  // shake ~1.6s with rising ticks, then pop the lid
  duck(.3);sfxShake();
  if(navigator.vibrate)try{navigator.vibrate([20,140,20,140,20,140,40])}catch(x){}
  setTimeout(function(){
    scene.classList.remove('shaking');scene.classList.add('opened');
    sfxOpen();
    burst(['✨','💖','🎀'],18,260);
    setTimeout(done,650);
  },1600);
}
function done(){
  var pi=st.next,p=PR[pi],m=st.parts[st.k];
  st.prizes.push(pi);st.k++;if(st.k<st.n)st.next=pick();save();busy=false;render();
  var card=document.getElementById('wCard');card.className='card r'+p.r;
  document.getElementById('wTag').textContent=RN[p.r];
  document.getElementById('wIcon').textContent=p.i;
  document.getElementById('wName').textContent=p.n;
  var wm=document.getElementById('wMoney');wm.style.animation='none';void wm.offsetWidth;wm.style.animation='';wm.textContent='💰 + ၀ ကျပ်';
  var t0=performance.now()+1000;(function cu(now){var q=Math.max(0,Math.min(1,(now-t0)/1200)),e=1-Math.pow(1-q,3);
    wm.textContent='💰 + '+fmt(Math.round(m*e/100)*100)+' ကျပ်';if(q<1)requestAnimationFrame(cu)})(performance.now());
  setTimeout(function(){burst(['💰','🪙','✨'],20,280)},1000);
  document.getElementById('win').classList.add('on');
  fanfare(p.r);coin();
  if(p.r===0)burst(['💖','💕','😘'],14,220);
  if(p.r===1)burst(['💖','🌹','✨','🏮','💛'],26,300);
  if(p.r===2){var fl=document.getElementById('flash');fl.classList.remove('on');void fl.offsetWidth;fl.classList.add('on');
    burst(['👑','💖','✨','🎉','🏮','💎','🌹','🎈'],48,420);setTimeout(function(){burst(['💖','🎊','⭐'],30,380)},500);
    if(navigator.vibrate)try{navigator.vibrate([80,40,80,40,160])}catch(x){}}
}
function closeWin(){
  document.getElementById('win').classList.remove('on');
  if(st.k>=st.n)showFinal();else{newWheel();duck(1)}
}
function showFinal(){
  var h='';
  st.prizes.forEach(function(pi,i){var p=PR[pi];
    h+='<div class="row"><span>'+mm(i+1)+'. '+p.i+' '+p.n+'</span><span>'+fmt(st.parts[i])+'</span></div>'});
  document.getElementById('summary').innerHTML=h;
  document.getElementById('totalTxt').textContent='💰 စုစုပေါင်း '+fmt(sum())+' ကျပ်';
  document.getElementById('loveTxt').textContent=(st.name?st.name+' ရေ…\n':'')+'သီတင်းကျွတ် မီးရောင်လေးတွေလိုပဲ\nဘဝမှာ အမြဲ လင်းလင်းလက်လက် ပျော်ရွှင်ပါစေ 🏮\n\nအိပ်မက်လေးတွေ အကုန်ပြည့်ပြီး\nJapan ကိုလည်း အမြန်ဆုံး ရောက်ပါစေ 🗾✈️\n\nပင်လယ်တွေ ခြားခြား၊ ကောင်းကင်တွေ ဝေးဝေး\nသီတင်းကျွတ် လရောင်အောက်မှာ\nကိုကို့နှလုံးသား မီးအိမ်လေးက\nမင်းလေးအတွက်ပဲ အမြဲ လင်းနေမှာပါ 🏮❤️';
  document.getElementById('final').classList.add('on');
  burst(['💖','🏮','🎉','✨','🎈','💕'],50,420);duck(.3);sfxFinal();setTimeout(function(){duck(1)},3500);
}
function clearData(){
  if(busy)return;
  if(!confirm('သိမ်းထားသော data အားလုံး ဖျက်မလား?'))return;
  try{localStorage.removeItem(KEY)}catch(e){}
  document.getElementById('final').classList.remove('on');
  var nm=st.name;st=null;newGame(DEF_N);st.name=nm;save();newWheel();render();
}

document.getElementById('spinBtn').onclick=spin;
document.getElementById('gift').onclick=spin;
document.getElementById('clearBtn').onclick=clearData;
document.getElementById('sndBtn').onclick=function(){snd=!snd;this.textContent=snd?'🔊 အသံ':'🔇 အသံပိတ်';
  if(AC&&MS)MS.gain.setTargetAtTime(snd?.9:0,AC.currentTime,.05);if(snd)startBgm();else stopBgm()};
document.getElementById('musBtn').onclick=function(){bgmOn=!bgmOn;this.textContent=bgmOn?'🎵 နောက်ခံတေး':'🎵 တေးပိတ်';if(bgmOn)startBgm();else stopBgm()};
['click','touchend','keydown'].forEach(function(ev){document.addEventListener(ev,function first(){
  audio();startBgm();if(!BGM.paused||!snd||!bgmOn)['click','touchend','keydown'].forEach(function(e){document.removeEventListener(e,first)})})});
document.addEventListener('visibilitychange',function(){if(document.hidden){stopBgm();if(AC)AC.suspend()}else if(snd){if(AC)AC.resume();startBgm()}});
document.getElementById('nm').oninput=function(){st.name=this.value;save()};
document.getElementById('nm').onkeydown=function(e){if(e.key==='Enter')this.blur()};

(function(){
  var s=document.getElementById('sky'),em=['🏮','🎈','💖','🪔','🎈','💕'];
  for(var i=0;i<40;i++){var t=document.createElement('div');t.className='star';
    t.style.left=Math.random()*100+'%';t.style.top=Math.random()*70+'%';t.style.animationDelay=Math.random()*3+'s';s.appendChild(t)}
  for(var j=0;j<14;j++){var f=document.createElement('div');f.className='fl';
    f.textContent=em[j%em.length];f.style.left=Math.random()*95+'%';f.style.fontSize=(20+Math.random()*22)+'px';
    f.style.animationDuration=(14+Math.random()*14)+'s';f.style.animationDelay=(-Math.random()*20)+'s';
    f.style.setProperty('--dx',(Math.random()*60-30)+'px');f.style.setProperty('--r',(Math.random()*20-10)+'deg');
    f.style.opacity=.55+Math.random()*.4;s.appendChild(f)}
})();

load();if(st.k===0&&(st.n!==DEF_N||st.total!==TOTAL))newGame(DEF_N);if(!st.name){st.name=DEF_NAME;save()}document.getElementById('nm').value=st.name;newWheel();render();
if(st.k>=st.n)showFinal();
</script>
